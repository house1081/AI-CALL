logging:
  file:
    name: ./logs/ai-call-server.log
  charset:
    console: UTF-8
    file: UTF-8
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  level:
    com.aicall: WARN
    com.aicall.dialog: INFO
    com.aicall.service.CallAiVoiceService: INFO
    com.aicall.service.OutboundDialogLoopService: INFO
    com.aicall.service.DialogVoiceTrainingService: INFO
    com.aicall.service.FreeSwitchDialService: INFO
    com.aicall.service.OutboundAnswerVoiceService: INFO
    com.aicall.service.DashScopeVoiceTtsService: INFO
    com.aicall.service.VoicePlaybackService: INFO
    com.aicall.service.AsrRecognitionService: INFO
    com.aicall.service.CallUtteranceRecordService: INFO
    com.aicall.service.DialogRagRetrievalService: INFO
    com.aicall.service.DialogTrainingQaService: INFO
    com.aicall.schedule: INFO
    org.springframework: WARN

server:
  # 与 FreeSWITCH ESL(8021) 错开；本机 FS 回调用 127.0.0.1:8081（避免与 FS 控制台占用的 8081 冲突）
  port: 8081
  address: 127.0.0.1

spring:
  application:
    name: ai-call-server
  mandatory-file-encoding: UTF-8
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
    url: jdbc:mysql://127.0.0.1:3306/ai-call?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ai-call-jwt-secret-key-2026-min-256-bits-required-for-hs256
  expire-hours: 24

record:
  upload-path: ./uploads/record/

# FreeSWITCH 本机部署（WSL/Docker 映射 127.0.0.1:8021）
freeswitch:
  enabled: true
  host: 127.0.0.1
  sip-port: 5060
  esl-port: 8021
  # 须与 FS event_socket.conf 中 password 一致；默认 ClueCon
  esl-password: ClueCon
  gateway: default
  callback-secret: ""
  callback-base-url: http://127.0.0.1:8081
  # 振铃等待秒数；接通后通话时长由 dialog-max-call-sec+30 自动计算（勿只用 60，否则约 1 分钟 FS 会挂断）
  originate-timeout-sec: 60
  # direct=ESL originate sofia/gateway/... &park()，不经 default 里 socket 分机（当前推荐）
  # socket=loopback/号码/default → dialplan socket 8888；须与 FS all_to_ai 等分机一致
  outbound-mode: direct
  outbound-context: default
  originate-application: "&park()"
  connect-timeout-ms: 5000
  read-timeout-ms: 30000
  # 一通电话结束（含挂断/超时）后自动终止外呼任务，不再拨下一个客户
  task-terminate-after-call: true

# 外呼语音链路：ASR → LLM → CosyVoice TTS（定制 cosyvoice-v3-plus / 系统 cosyvoice-v3-flash）
ai-voice:
  enabled: true
  play-opening-on-answer: true
  auto-play-after-originate: true
  answer-watch-seconds: 50
  answer-max-ring-count: 10
  answer-ring-cycle-sec: 4
  answer-play-delay-ms: 0
  opening-prewarm-wait-ms: 100
  answer-watch-poll-ms: 150
  # cosyvoice=DashScope 仿真人声；http=外部 TTS；speak=FS 机械音
  tts-mode: cosyvoice
  tts-model: cosyvoice-v3-plus
  tts-voice: ""
  tts-clone-voice-id: 
  # 定制复刻 target_model / 合成 model；系统音色自动走 cosyvoice-v3-flash
  tts-response-format: audio
  tts-speech-rate: 1.08
  tts-pitch-rate: 1.0
  tts-volume: 100
  # CosyVoice Instruct（关闭可减轻 428；对话仍可用语速/音调参数）
  tts-instruction-enabled: false
  tts-instruction: 模仿资深金融信贷顾问语气，语气亲切稳重、自然流畅；介绍产品优势时适当加重语气、放慢语速；语句之间带自然短暂停顿，模拟真人说话的换气感，不要机械朗读，整体语气真诚不推销感过重。
  # 分句顺序 TTS：每句单独合成，句间智能停顿（关闭后整段一次合成，开口更快）
  tts-sentence-sequential-enabled: false
  tts-smart-pause-enabled: false
  tts-clause-pause-ms: 80
  tts-sentence-end-pause-ms: 120
  tts-inter-sentence-gap-ms: 100
  tts-dynamic-prosody-enabled: false
  # FS 侧背景办公音建议音量 0.2~0.25（在拨号方案/displace 配置）
  background-audio-volume: 0.22
  playback-peak-ratio: 0.92
  playback-tail-buffer-ms: 120
  playback-post-stop-ms: 20
  tts-http-url: ""
  playback-base-url: http://127.0.0.1:8081
  fs-fetch-via-esl: true
  fs-host-os: windows
  fs-shared-wav-dir: C:/temp/aicall-voice
  # 通话/ASR 录音落盘（FS uuid_record）；须与 FS 同机且可写
  fs-record-dir: D:/FreeSWITCH/record
  # 挂断后复制到 uploads/record，写入 call_record.record_url（如 /uploads/record/call_59_xxx.wav）
  call-record-enabled: true
  call-record-publish-dir: ./uploads/record/
  fs-push-wav-via-esl: false
  fs-temp-wav-dir: C:/temp/aicall-voice
  broadcast-legs: aleg
  fs-curl-wait-ms: 3000
  prefer-http-playback: false
  prefer-execute-playback: false
  fs-builtin-sound: ""
  speak-voice: en|flite
  speak-fallback-voices: en|callie,eng|flite
  # 单轮播报软上限（承接+口语提问）
  max-speak-chars: 36
  # 流式首句：有标点可更早开播；无标点时最多等这么多字（越低开口越快）
  stream-tts-first-chunk-chars: 10
  # 整句一次性识别，杜绝流式等待延迟
  asr-mode: sentence
  asr-stream-enabled: false
  # 电话 8k：paraformer-8k-v2（本机走 WebSocket 实时；公网可走文件转写）
  asr-dashscope-model: qwen3-asr-flash
  asr-paraformer-realtime-enabled: false
  asr-realtime-timeout-sec: 12
  asr-warm-on-startup: true
  outbound-ready-gate-enabled: true
  outbound-ready-max-wait-ms: 180000
  dialog-llm-max-tokens: 48
  # 略高温度，口语更自然、少背稿感
  dialog-llm-temperature: 0.5
  dialog-llm-top-p: 0.88
  # 关闭蜂鸣/内置音效/speak 机械音回退
  enable-tone-fallback: false
  enable-builtin-sound-fallback: false
  enable-speak-fallback: false
  # RTP 20ms 小包，降低堆积卡顿
  rtp-packetization-ms: 20
  disable-comfort-noise: true
  fs-socket-enabled: true
  fs-socket-host: 0.0.0.0
  fs-socket-port: 8888
  asr-http-url: ""
  asr-connect-timeout-ms: 5000
  asr-read-timeout-ms: 12000
  # ASR：抗杂音优先（尖峰噪声勿误触发开麦）；句末静音取档位与本值较大者
  asr-vad-enabled: true
  asr-vad-silence-ms: 350
  asr-vad-min-speech-ms: 280
  asr-vad-poll-ms: 16
  asr-vad-energy-threshold: 180
  # 增益过高会放大线路杂音；电话小声可再提到 2.5
  asr-input-gain: 2.0
  asr-enable-itn: true
  # 电话 ASR 不传 context-hint（qwen 易把热词整句误识为客户说话）；浏览器训练同样不传
  asr-context-hint: ""
  # 客户静音时先多问几遍，避免莫名挂机
  dialog-silence-probe-enabled: true
  dialog-silence-probe-ms: 8000
  dialog-silence-probe-min-ms: 7000
  dialog-silence-probe-max-ms: 12000
  dialog-silence-probe-max: 8
  # 均衡档：句末约 450ms，比 stable 更快开口
  silence-profile: balanced
  # 用户句末静音 yml 兜底（实际以 silence-profile 为准）
  user-silence-before-response-ms: 450
  asr-record-max-ms: 8000
  asr-max-slice-sec: 4
  asr-language: zh-CN
  asr-model: phone_call
  asr-audio-format: pcm
  dialog-record-chunk-sec: 3
  dialog-max-call-sec: 600
  dialog-max-rounds: 40
  dialog-post-play-wait-ms: 0
  # AI 播报结束尾音等待（播完已同步基线时尽量短）
  turn-based-playback-asr-tail-ms: 50
  # 播报结束自动对齐 ASR 基线，避免回声误打断
  sync-asr-baseline-after-playback: true
  sentence-pause-ms: 40
  # false=整段一次 TTS+一次播放，避免分句多次 displace 产生中间空白
  tts-stream-enabled: false
  dialog-enabled: true
  # 每轮都调大模型+带对话历史（与后台「对话训练」一致）；false 时规则话术可绕过模型
  dialog-llm-primary: true
  # 略减历史，缩短 prompt、压 LLM 尾延迟
  dialog-max-history-rounds: 6
  dialog-llm-async: true
  dialog-llm-stream: true
  # LLM 出字即开播：首句约 36 字，多数回合无二次补播，兼顾延迟与连贯
  dialog-llm-stream-tts: true
  # 仅约束 LLM 生成（TTS/播报在超时外）；TTFT 负责「多久必须开口」
  dialog-llm-timeout-sec: 9
  # 首句开播门控：超时仍未真正开播则立刻主线/槽位兜底，禁止空等
  dialog-llm-ttft-timeout-sec: 3
  dialog-llm-pool-size: 6
  opening-voice-precache-enabled: true
  # 启动时仅检查开场白/结束语预录是否就绪，不自动 CosyVoice 合成
  opening-voice-precache-on-startup: true
  opening-voice-cache-dir: ./uploads/tts/opening
  tts-phrase-cache-dir: ./uploads/tts/phrases
  tts-phrase-cache-enabled: true
  tts-phrase-cache-max-entries: 2048
  dialog-reply-audio-cache-enabled: true
  dialog-reply-audio-cache-dir: ./uploads/tts/reply-cache
  dialog-reply-audio-cache-max-entries: 1024
  dialog-reply-audio-cache-min-user-chars: 2
  dialog-reply-audio-cache-max-user-chars: 80
  prerecord-circuit-enabled: true
  prerecord-pause-min-ms: 500
  prerecord-pause-max-ms: 1200
  # 外呼播完异步：智能预录 + 问答缓存命中时不阻塞匹配阶段（下一轮听音前 awaitOutboundPlaybackReady）
  prerecord-playback-async: true
  kb-wav-cache-max-entries: 4096
  tts-min-interval-ms: 0
  tts-rate-limit-cooldown-ms: 1200
  tts-rate-limit-retries: 0
  tts-phrase-warm-on-startup: true
  # 外呼就绪门控开启时 TTS 预热在 ASR 之后立即执行；关闭门控时仍可用此延迟错开首通
  opening-voice-precache-delay-ms: 0
  startup-quiet: true
  playback-barge-in-energy-threshold: 520
  # 轮次制默认不插嘴，避免杂音把 AI 话切成断续
  barge-in-during-turn-based: false
  barge-in-enabled: true
  barge-in-threshold: 18
  barge-in-hold-ms: 420
  playback-barge-in-grace-ms: 2200
  playback-barge-in-min-ratio: 0.85
  # 电话线路直接 8k，避免 16k→8k 重采样发虚、发糊
  tts-sample-rate: 8000

# 对话训练 RAG 热更新（方案一：本地向量库即时生效）
dialog-rag:
  enabled: true
  store-type: local
  embedding-model: text-embedding-v3
  top-k: 3
  direct-answer-score: 0.88
  min-retrieve-score: 0.60
  strict-no-match-fallback: false
  manual-correction-weight: 3.0
  quality-sample-weight: 2.0
  negative-sample-weight: 1.5
  loan-main-flow-enabled: true
  loan-pack-auto-import: true
  loan-pack-sync-fallbacks-on-startup: true
  loan-pack-sync-main-flow-on-startup: true
  enrich-index-with-keywords: true
  prerecord-retrieve-top-k: 8
  high-confidence-faq-score: 1.85
  playable-min-score: 0.62
  # AI 外呼向量检索硬超时，超时跳过不挡开口
  retrieve-timeout-ms: 800
  # Milvus 扩展（store-type=milvus 时需部署 Milvus 并自行对接）
  milvus-host: 127.0.0.1
  milvus-port: 19530
  milvus-collection: dialog_training_qa

# Ollama 本地大模型（未配置 dashscope.api-key 时作兜底）
ollama:
  base-url: http://192.168.60.28:11434
  model: qwen:4b
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  max-tokens: 128
  temperature: 0.7
  max-history-rounds: 10

# 阿里云通义千问 DashScope
# API Key 请在管理端「模型配置」→ 通义千问 中填写（推荐）；下方 api-key / DASHSCOPE_API_KEY 仅作兜底
# API Key 获取：https://dashscope.console.aliyun.com/apiKey
dashscope:
  enabled: true
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.5-omni-flash
  max-tokens: 256
  temperature: 0.45
  top-p: 0.88
  max-history-rounds: 10
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
