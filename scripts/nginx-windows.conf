# Windows Nginx 部署 ai-call-web + ai-call-work
# 用法：复制到 nginx 安装目录 conf/ 下，或 include 进 nginx.conf
#
# 1. 先 npm run build 生成 dist
# 2. 修改下面 root 路径为实际 dist 目录（建议用正斜杠）
# 3. 后端 java -jar 运行在 127.0.0.1:8081
# 4. nginx -t && nginx -s reload

# 管理端 ai-call-web  → http://localhost/
server {
    listen       80;
    server_name  localhost;

    root   D:/work/ai_call/AI-CALL/ai-call-web/dist;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:8081/uploads/;
        proxy_set_header   Host $host;
    }
}

# 租户工作台 ai-call-work → http://localhost:8088/
